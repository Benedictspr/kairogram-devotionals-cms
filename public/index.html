<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kairogram Devotionals Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@600;700;800&family=Funnel+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="mobile-app-wrapper">

    <!-- Top Compact Mobile App Bar -->
    <header class="app-top-bar">
      <div class="brand-wrap">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.3">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            <line x1="12" y1="6" x2="12" y2="13"></line>
            <line x1="8.5" y1="9.5" x2="15.5" y2="9.5"></line>
          </svg>
        </div>
        <div class="brand-meta">
          <h1 class="brand-title">Kairogram Studio</h1>
          <div class="live-pill">
            <span class="live-dot"></span>
            <span>Live on Vercel</span>
          </div>
        </div>
      </div>

      <div class="top-bar-actions">
        <button type="button" class="btn-top-icon" id="btnAutoFetchUpcoming" title="Auto-Fetch Tomorrow">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
          <span class="btn-text-hide-mobile">Auto-Fetch</span>
        </button>
        <button type="button" class="btn-top-icon" id="btnQuickExportJson" title="Export Database JSON">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Segmented Touch Navigation (3 Simple Tabs) -->
    <nav class="mobile-tabs-bar">
      <button type="button" class="tab-item active" data-tab="tabBatchIngest">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
          <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
          <line x1="9" y1="12" x2="15" y2="12"></line>
          <line x1="9" y1="16" x2="13" y2="16"></line>
        </svg>
        <span>Quick Paste</span>
      </button>

      <button type="button" class="tab-item" data-tab="tabSingleForm">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
        </svg>
        <span>Form Entry</span>
      </button>

      <button type="button" class="tab-item" data-tab="tabLibrary">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
        <span>Library (<span id="countStoredLib">0</span>)</span>
      </button>
    </nav>

    <!-- Main Views Container -->
    <main class="mobile-content-viewport">

      <!-- ================= TAB 1: QUICK PASTE (PRIMARY MOBILE VIEW) ================= -->
      <section class="mobile-tab-view active" id="tabBatchIngest">
        
        <!-- Ministry Selection -->
        <div class="mobile-card">
          <div class="card-title-row">
            <span class="card-step-badge">1</span>
            <label class="card-label-lg" for="batchChurchSelect">Select Church Ministry</label>
          </div>
          <select class="mobile-select-lg" id="batchChurchSelect">
            <option value="rccg_open_heavens">RCCG • Open Heavens (Pastor Adeboye)</option>
            <option value="dclm_dclm">Deeper Life • Daily Manna (Pastor Kumuyi)</option>
            <option value="mfm_mfm">MFM • Mountain Top Life (Dr. Olukoya)</option>
            <option value="christ_embassy_rhapsody">Christ Embassy • Rhapsody of Realities (Pastor Chris)</option>
            <option value="odm_odm">Our Daily Manna • ODM (Bishop Chris)</option>
            <option value="dunamis_seeds">Dunamis • Seeds of Destiny (Dr. Enenche)</option>
            <option value="winners_winners">Winners Chapel • Word of Faith (Bishop Oyedepo)</option>
            <option value="rccg_rccg_ss_adult">RCCG Sunday School • Adult Students</option>
            <option value="rccg_rccg_ss_teacher">RCCG Sunday School • Teachers Manual</option>
            <option value="rccg_rccg_yaya_student">RCCG YAYA Sunday School • Youths</option>
          </select>
        </div>

        <!-- Text Input Box -->
        <div class="mobile-card">
          <div class="card-title-row">
            <div class="title-with-step">
              <span class="card-step-badge">2</span>
              <label class="card-label-lg" for="batchTextInput">Paste Devotional(s)</label>
            </div>
            <button type="button" class="btn-clipboard-paste" id="btnClipboardPaste" title="Paste from phone clipboard">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>
              <span>Paste</span>
            </button>
          </div>

          <textarea class="mobile-textarea" id="batchTextInput" placeholder="Paste 1 day, 7 days, or a whole month here...

Real-life headings auto-detected:
• RCCG: MEMORISE, BIBLE READING, PRAYER POINT
• DCLM: KEY VERSE, TEXT, THOUGHT FOR THE DAY
• MFM: FIRE SCRIPTURE, MOTIVATIONAL QUOTE, MORNING/EVENING PRAYERS
• Rhapsody: OPENING SCRIPTURE, CONFESSION, FURTHER STUDY
• ODM: DEVOTIONAL CAPSULE, BASIC SCRIPTURE, PRAYER BULLETS
• Sunday School: LESSON, OUTLINES, DISCUSSION, ASSIGNMENT"></textarea>

          <!-- Quick Template Helper Chips -->
          <div class="quick-helpers-row" style="flex-wrap:wrap;gap:6px;">
            <button type="button" class="btn-micro-chip" id="btnPasteSampleOpenHeavens">Open Heavens</button>
            <button type="button" class="btn-micro-chip" id="btnPasteSampleDclm">Daily Manna</button>
            <button type="button" class="btn-micro-chip" id="btnPasteSampleMfm">MFM Mountain Top</button>
            <button type="button" class="btn-micro-chip" id="btnPasteSampleRhapsody">Rhapsody</button>
            <button type="button" class="btn-micro-chip" id="btnPasteSampleSundaySchool">Sunday School</button>
            <button type="button" class="btn-micro-chip text-muted" id="btnClearBatchInput">Clear</button>
          </div>

          <!-- Action Buttons -->
          <div class="mobile-actions-stack">
            <button type="button" class="btn-mobile-primary" id="btnParseBatch">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
              <span>Parse & Preview Days</span>
            </button>
          </div>
        </div>

        <!-- Parsed Days Preview & Direct Cloud Publishing -->
        <div class="mobile-card" id="parsedCardSection">
          <div class="card-title-row">
            <div class="title-with-step">
              <span class="card-step-badge">3</span>
              <span class="card-label-lg">Parsed Days (<span id="parsedDaysCount">0</span>)</span>
            </div>
            <button type="button" class="btn-publish-all" id="btnPublishAllBatch" disabled>
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
              <span>Publish to Kairogram</span>
            </button>
          </div>

          <div class="mobile-parsed-list" id="parsedListContainer">
            <div class="mobile-empty-state">
              <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
              <p>Paste text above and tap <strong>Parse & Preview Days</strong> to see them here.</p>
            </div>
          </div>
        </div>

      </section>

      <!-- ================= TAB 2: ADAPTIVE FORM ENTRY ================= -->
      <section class="mobile-tab-view" id="tabSingleForm">
        <div class="mobile-card">
          <div class="card-title-row">
            <h2 class="card-label-lg" id="formHeaderTitle">Devotional Entry</h2>
            <button type="button" class="btn-publish-all" id="btnSaveSingleDevotional">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path></svg>
              <span>Publish</span>
            </button>
          </div>

          <div class="mobile-field-group">
            <label class="field-label">Church</label>
            <select class="mobile-select-lg" id="formChurch">
              <option value="rccg">RCCG (Redeemed Christian Church of God)</option>
              <option value="dclm">Deeper Life (DCLM)</option>
              <option value="mfm">MFM (Mountain of Fire & Miracles)</option>
              <option value="christ_embassy">Christ Embassy (Rhapsody)</option>
              <option value="odm">Our Daily Manna (ODM)</option>
              <option value="dunamis">Dunamis International</option>
              <option value="winners">Winners Chapel (Living Faith)</option>
            </select>
          </div>

          <div class="mobile-field-group">
            <label class="field-label">Publication / Manual</label>
            <select class="mobile-select-lg" id="formManual">
              <option value="open_heavens">Open Heavens Daily Devotional</option>
              <option value="dclm">Daily Manna</option>
              <option value="mfm">Mountain Top Life</option>
              <option value="rhapsody">Rhapsody of Realities</option>
              <option value="odm">Our Daily Manna</option>
              <option value="seeds">Seeds of Destiny</option>
              <option value="rccg_ss_adult">RCCG Sunday School (Adult Students)</option>
              <option value="rccg_ss_teacher">RCCG Sunday School (Adult Teachers)</option>
              <option value="rccg_yaya_student">RCCG YAYA Sunday School (Students)</option>
              <option value="rccg_yaya_teacher">RCCG YAYA Sunday School (Teachers Guide)</option>
            </select>
          </div>

          <!-- Sunday School Lesson Number (Shown for SS) -->
          <div class="mobile-field-group hidden" id="groupSsLessonNum">
            <label class="field-label">Lesson Number</label>
            <input type="number" class="mobile-input-lg" id="formLessonNum" value="3" placeholder="e.g. 3">
          </div>

          <div class="mobile-field-group">
            <label class="field-label">Date</label>
            <input type="date" class="mobile-input-lg" id="formDate" value="2026-09-20">
          </div>

          <div class="mobile-field-group">
            <label class="field-label">Topic / Title</label>
            <input type="text" class="mobile-input-lg" id="formTopic" placeholder="e.g. The Wonders of Divine Favor">
          </div>

          <div class="mobile-field-group">
            <label class="field-label">Author / Leader</label>
            <input type="text" class="mobile-input-lg" id="formAuthor" placeholder="e.g. Pastor E.A. Adeboye" value="Pastor E.A. Adeboye">
          </div>

          <!-- Dynamic Memory / Key Verse Ref -->
          <div class="mobile-field-group">
            <label class="field-label" id="lblFormMemoryRef">Memory Verse Reference</label>
            <input type="text" class="mobile-input-lg" id="formMemoryRef" placeholder="e.g. Psalm 102:13">
          </div>

          <!-- Dynamic Reading / Fire Scripture / Text Ref -->
          <div class="mobile-field-group">
            <label class="field-label" id="lblFormReadingRef">Bible Reading Passage</label>
            <input type="text" class="mobile-input-lg" id="formReadingRef" placeholder="e.g. Esther 2:15-18">
          </div>

          <div class="mobile-field-group">
            <label class="field-label" id="lblFormMemoryText">Memory Verse Quotation</label>
            <textarea class="mobile-textarea sm" id="formMemoryText" placeholder="Verse quotation text..."></textarea>
          </div>

          <!-- MFM Motivational Quote -->
          <div class="mobile-field-group hidden" id="groupMotivationalQuote">
            <label class="field-label">Motivational Quote (MFM)</label>
            <input type="text" class="mobile-input-lg" id="formMotivationalQuote" placeholder="e.g. A prayerless Christian is a powerless believer.">
          </div>

          <!-- MFM / ODM / Dunamis Prophetic Word -->
          <div class="mobile-field-group hidden" id="groupPropheticWord">
            <label class="field-label">Prophetic Word / Declaration</label>
            <input type="text" class="mobile-input-lg" id="formPropheticWord" placeholder="e.g. The Lord shall fight for you today!">
          </div>

          <!-- ODM Devotional Capsule -->
          <div class="mobile-field-group hidden" id="groupDevotionalCapsule">
            <label class="field-label">Devotional Capsule (ODM)</label>
            <textarea class="mobile-textarea sm" id="formDevotionalCapsule" placeholder="ODM inspirational opening capsule..."></textarea>
          </div>

          <!-- Sunday School Lesson Introduction -->
          <div class="mobile-field-group hidden" id="groupSsIntro">
            <label class="field-label">Lesson Introduction (Sunday School)</label>
            <textarea class="mobile-textarea sm" id="formSsIntro" placeholder="Class introduction..."></textarea>
          </div>

          <!-- Teacher's Aim & Objectives -->
          <div class="mobile-field-group hidden" id="groupSsTeacher">
            <label class="field-label">Teacher's Lesson Aim & Objectives</label>
            <textarea class="mobile-textarea sm" id="formSsTeacherAim" placeholder="Teaching aim and objectives..."></textarea>
          </div>

          <!-- YAYA Youth Focus -->
          <div class="mobile-field-group hidden" id="groupSsYouthFocus">
            <label class="field-label">Youth Focus / Relevance</label>
            <input type="text" class="mobile-input-lg" id="formSsYouthFocus" placeholder="Youth relevance note...">
          </div>

          <!-- Message Content / Outlines -->
          <div class="mobile-field-group" id="groupMessageBody">
            <label class="field-label" id="lblFormMessageText">Devotional Message (Empty line between paragraphs)</label>
            <textarea class="mobile-textarea md" id="formMessageText" placeholder="Devotional message content..."></textarea>
          </div>

          <!-- Sunday School Outlines 1 & 2 -->
          <div class="mobile-field-group hidden" id="groupSsOutlines">
            <label class="field-label">Lesson Outline 1</label>
            <textarea class="mobile-textarea sm" id="formSsOutline1" placeholder="Title and bullet points for outline 1..."></textarea>
            <label class="field-label" style="margin-top:8px;">Lesson Outline 2</label>
            <textarea class="mobile-textarea sm" id="formSsOutline2" placeholder="Title and bullet points for outline 2..."></textarea>
          </div>

          <!-- Sunday School Class Discussion / Questions -->
          <div class="mobile-field-group hidden" id="groupSsDiscussion">
            <label class="field-label">Class Discussion / Questions</label>
            <textarea class="mobile-textarea sm" id="formSsDiscussion" placeholder="Discussion questions for students..."></textarea>
          </div>

          <!-- DCLM Thought for the Day -->
          <div class="mobile-field-group hidden" id="groupThoughtForTheDay">
            <label class="field-label">Thought for the Day (Daily Manna)</label>
            <input type="text" class="mobile-input-lg" id="formThoughtForTheDay" placeholder="e.g. God's standard of holiness is non-negotiable.">
          </div>

          <!-- Rhapsody Confession -->
          <div class="mobile-field-group hidden" id="groupConfession">
            <label class="field-label">Confession / Prayer (Rhapsody of Realities)</label>
            <textarea class="mobile-textarea sm" id="formConfession" placeholder="Faith confession or declaration..."></textarea>
          </div>

          <!-- Rhapsody Further Study -->
          <div class="mobile-field-group hidden" id="groupFurtherStudy">
            <label class="field-label">Further Study (Scripture References)</label>
            <input type="text" class="mobile-input-lg" id="formFurtherStudy" placeholder="e.g. Romans 8:1-2; Ephesians 1:3; Colossians 1:27">
          </div>

          <!-- MFM Morning Prayers -->
          <div class="mobile-field-group hidden" id="groupMorningPrayers">
            <label class="field-label">Morning Prayers (MFM Warfare)</label>
            <textarea class="mobile-textarea sm" id="formMorningPrayers" placeholder="Morning prayer points (one per line)..."></textarea>
          </div>

          <!-- MFM Evening Prayers -->
          <div class="mobile-field-group hidden" id="groupEveningPrayers">
            <label class="field-label">Evening Prayers (MFM Warfare)</label>
            <textarea class="mobile-textarea sm" id="formEveningPrayers" placeholder="Evening prayer points (one per line)..."></textarea>
          </div>

          <!-- General Prayer Points / Bullets -->
          <div class="mobile-field-group" id="groupPrayerPoints">
            <label class="field-label" id="lblFormPrayerPoints">Prayer Points</label>
            <textarea class="mobile-textarea sm" id="formPrayerPoints" placeholder="Prayer points (one per line)..."></textarea>
          </div>

          <!-- Sunday School Summary & Assignment -->
          <div class="mobile-field-group hidden" id="groupSsSummaryAssignment">
            <label class="field-label">Lesson Summary & Conclusion</label>
            <textarea class="mobile-textarea sm" id="formSsSummary" placeholder="Summary and conclusion..."></textarea>
            <label class="field-label" style="margin-top:8px;">Weekly Assignment</label>
            <input type="text" class="mobile-input-lg" id="formSsAssignment" placeholder="e.g. Write out three ways to cultivate personal holiness.">
          </div>

          <div class="mobile-field-group" id="groupHymn">
            <label class="field-label" id="lblFormHymn">Hymn / Lyrics</label>
            <input type="text" class="mobile-input-lg" id="formHymnOrConfession" placeholder="Hymn title or lyrics...">
          </div>

          <div class="mobile-field-group" id="groupBibleInOneYear">
            <label class="field-label" id="lblFormBibleInOneYear">Bible in One Year / Reading Plan</label>
            <input type="text" class="mobile-input-lg" id="formBibleInOneYear" placeholder="e.g. 1 Peter 1-3; Psalm 119">
          </div>

          <button type="button" class="btn-mobile-primary" id="btnSaveSingleDevotionalBottom" style="margin-top:10px;">
            <span>Publish Devotional to Kairogram</span>
          </button>
        </div>
      </section>

      <!-- ================= TAB 3: LIBRARY ================= -->
      <section class="mobile-tab-view" id="tabLibrary">
        <div class="mobile-card">
          <div class="card-title-row">
            <h2 class="card-label-lg">Published Editions</h2>
            <span class="card-sub-count"><span id="libraryCountBadge">0</span> stored</span>
          </div>

          <!-- Quick Filter Horizontal Pills -->
          <div class="mobile-filter-pills" id="libraryFilterPills">
            <button type="button" class="filter-pill active" data-filter="all">All</button>
            <button type="button" class="filter-pill" data-filter="rccg">RCCG</button>
            <button type="button" class="filter-pill" data-filter="dclm">Deeper Life</button>
            <button type="button" class="filter-pill" data-filter="mfm">MFM</button>
            <button type="button" class="filter-pill" data-filter="christ_embassy">Rhapsody</button>
            <button type="button" class="filter-pill" data-filter="odm">ODM</button>
          </div>
        </div>

        <div class="mobile-library-list" id="libraryGrid">
          <!-- Dynamically populated with mobile cards -->
        </div>
      </section>

    </main>

    <!-- Mobile Toast -->
    <div class="mobile-toast hidden" id="cmsToast">Notification message</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
